    : list.map(a => {
      const st = status(a); const cnt = S.mode !== 'local' && a.deadline ? `<span>신청 ${(S.applicants[a.id] || []).length}명</span>` : '';
      return `<li class="m-row"><span class="m-title">${esc(a.title)}</span>
        <span class="m-sub">${catChip(a)}<span>${esc(range(a.startDate, a.endDate))}</span>${a.deadline ? `<span>마감 ${esc(md(a.deadline))} · ${esc(st.label)}</span>` : ''}${cnt}${a.sample ? '<span class="chip sample">예시</span>' : ''}</span>
        <span class="m-acts">${S.deleting === a.id
          ? `<span class="confirm">삭제할까요?</span><button type="button" class="btn danger solid small" data-act="del-confirm" data-id="${esc(a.id)}">삭제</button><button type="button" class="btn small" data-act="del-cancel">취소</button>`
          : `<button type="button" class="btn small" data-act="open" data-id="${esc(a.id)}">포스터 보기</button><button type="button" class="btn small" data-act="edit" data-id="${esc(a.id)}">수정</button><button type="button" class="btn small danger" data-act="del" data-id="${esc(a.id)}">삭제</button>`}</span></li>`;
    }).join('');
}
$('#manage-q').addEventListener('input', e => { S.manageQ = e.target.value; renderManageList(); });

function openForm(id) {
  const a = id ? S.acts.find(x => x.id === id) : null;
  const v = a || { category: '진로체험', posterColor: 'purple', grades: [], areas: [], subjects: [], careers: [] };
  S.editing = { id: a ? a.id : null, image: (a && a.posterImage) || '', color: v.posterColor || 'purple', createdAt: a && a.createdAt };
  $('#form-title').textContent = a ? '활동 수정' : '새 활동 등록';
  showErr('#form-err', '');
  const tog = (name, opts, sel) => opts.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<button type="button" class="tog" data-tog="${name}" data-val="${esc(val)}" aria-pressed="${(sel || []).map(String).includes(String(val))}">${esc(lab)}</button>`; }).join('');
  const careersFree = (v.careers || []).filter(c => !TRACKS.includes(c));
  $('#form-body').innerHTML = `
    <div class="form-sec"><h3>기본 정보</h3>
      <div class="field"><label for="f-title">활동 이름 *</label><input id="f-title" value="${esc(v.title || '')}" placeholder="예) 의생명 탐구 캠프"></div>
      <div class="field-2"><div class="field"><label for="f-cat">분류 *</label><select id="f-cat">${CATS.map(c => `<option${v.category === c ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="field"><label for="f-org">담당 부서·교사</label><input id="f-org" value="${esc(v.organizer || '')}" placeholder="예) 진로진학부"></div></div>
      <div class="field-2"><div class="field"><label for="f-loc">장소</label><input id="f-loc" value="${esc(v.location || '')}" placeholder="예) 강당"></div>
      <div class="field"><label for="f-cap">정원 (명)</label><input id="f-cap" type="number" min="0" inputmode="numeric" value="${esc(v.capacity || '')}"></div></div>
    </div>
    <div class="form-sec"><h3>일정</h3>
      <div class="field-2"><div class="field"><label for="f-start">활동 시작일 *</label><input id="f-start" type="date" value="${esc(v.startDate || '')}"></div>
      <div class="field"><label for="f-end">활동 종료일</label><input id="f-end" type="date" value="${esc(v.endDate || '')}"></div></div>
      <div class="field-2"><div class="field"><label for="f-applystart">신청 시작일</label><input id="f-applystart" type="date" value="${esc(v.applyStart || '')}"></div>
      <div class="field"><label for="f-deadline">신청 마감일</label><input id="f-deadline" type="date" value="${esc(v.deadline || '')}"></div></div>
      <p class="hint">신청 마감일을 비워 두면 신청이 없는 학사일정(시험, 방학식 등)으로 표시돼요.</p>
    </div>
    <div class="form-sec"><h3>대상과 생기부</h3>
      <div class="field"><span class="label">대상 학년 <span class="hint">고르지 않으면 전 학년</span></span><div class="togs">${tog('grades', [[1, '1학년'], [2, '2학년'], [3, '3학년']], v.grades)}</div></div>
      <div class="field"><span class="label">생기부 영역</span><div class="togs">${tog('areas', AREAS, v.areas)}</div></div>
      <label class="check"><input type="checkbox" id="f-important"${v.important ? ' checked' : ''}> 생기부 중요 활동으로 표시 (학생 맞춤 추천에 우선 노출)</label>
      <div class="field"><span class="label">관련 과목</span><div class="togs">${tog('subjects', SUBJECTS, v.subjects)}</div></div>
      <div class="field"><span class="label">관련 진로 계열</span><div class="togs">${tog('tracks', TRACKS, v.careers)}</div></div>
      <div class="field"><label for="f-careers">관련 장래희망·키워드</label><input id="f-careers" value="${esc(careersFree.join(', '))}" placeholder="쉼표로 구분 예) 의사, 약사, 연구원"></div>
    </div>
    <div class="form-sec"><h3>포스터</h3>
      <div class="field"><label for="f-desc">활동 소개</label><textarea id="f-desc" placeholder="무엇을 하는 활동인지, 준비물, 유의사항 등을 적어 주세요.">${esc(v.description || '')}</textarea></div>
      <div class="poster-up"><div class="poster-thumb" id="f-thumb"></div>
        <div class="field" style="flex:1;min-width:200px"><span class="label">포스터 이미지</span>
          <div class="set-actions"><span class="btn small file-btn">이미지 올리기<input type="file" id="f-image" accept="image/*" aria-label="포스터 이미지 올리기"></span>
          <button type="button" class="btn small ghost" data-act="img-remove">이미지 빼기</button></div>
          <p class="hint">이미지가 없으면 입력한 내용으로 포스터를 자동으로 만들어요.</p>
          <span class="label">자동 포스터 색상</span>
          <div class="swatches">${POSTER_COLORS.map(([c, lab]) => `<button type="button" class="swatch" data-act="swatch" data-id="${c}" style="--sw:var(--poster-${c})" aria-label="${lab}" aria-pressed="${S.editing.color === c}"></button>`).join('')}</div>
        </div></div>
    </div>`;
  updateThumb();
  $('#f-image').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try { S.editing.image = await posterImage(f); updateThumb(); showErr('#form-err', ''); }
    catch { showErr('#form-err', '이미지를 넣지 못했어요. 더 작은 JPG·PNG 파일을 골라 주세요.'); }
  });
  $('#f-title').addEventListener('input', updateThumb);
  $('#f-cat').addEventListener('change', updateThumb);
  $('#ov-form').hidden = false;
  $('#form-body').scrollTop = 0;
  if (matchMedia('(hover: hover)').matches) setTimeout(() => $('#f-title').focus(), 30);
}
function updateThumb() {
  const a = { title: $('#f-title').value, category: $('#f-cat').value, posterColor: S.editing.color, startDate: $('#f-start') ? $('#f-start').value : '' };
  $('#f-thumb').innerHTML = posterHTML(a, { image: S.editing.image });
}
$('#act-form').addEventListener('submit', async e => {
  e.preventDefault();
  const val = id => $(id).value.trim();
  const picks = name => $$(`#form-body [data-tog="${name}"][aria-pressed="true"]`).map(b => b.dataset.val);
  const title = val('#f-title'), start = val('#f-start');
  let end = val('#f-end'); const applyStart = val('#f-applystart'), deadline = val('#f-deadline');
  if (!title) return showErr('#form-err', '활동 이름을 입력해 주세요.');
  if (!start) return showErr('#form-err', '활동 시작일을 입력해 주세요.');
  if (end && end < start) return showErr('#form-err', '종료일이 시작일보다 빨라요. 날짜를 확인해 주세요.');
  if (applyStart && deadline && deadline < applyStart) return showErr('#form-err', '신청 마감일이 신청 시작일보다 빨라요.');
  if (end === start) end = '';
  const free = val('#f-careers').split(/[,，]/).map(s => s.trim()).filter(Boolean);
  const data = {
    title, category: val('#f-cat'), organizer: val('#f-org'), location: val('#f-loc'),
    capacity: Number(val('#f-cap')) || null, startDate: start, endDate: end, applyStart, deadline,
    grades: picks('grades').map(Number), areas: picks('areas'), subjects: picks('subjects'),
    careers: [...picks('tracks'), ...free], important: $('#f-important').checked,
    description: $('#f-desc').value.trim(), posterImage: S.editing.image || '', posterColor: S.editing.color,
    createdAt: S.editing.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString(), updatedBy: S.session.name
  };
  if (JSON.stringify(data).length > 240000) return showErr('#form-err', '포스터 이미지가 너무 커요. 더 작은 이미지를 올려 주세요.');
  const btn = $('#form-save'); btn.disabled = true; btn.textContent = '저장 중…'; showErr('#form-err', '');
  try {
    const wasNew = !S.editing.id;
    const id = await saveActivity(S.editing.id, data);
    $('#ov-form').hidden = true;
    toast(wasNew ? '활동을 등록했어요.' : '수정한 내용을 저장했어요.');
    if (S.view === 'poster' || wasNew) { S.posterId = id; S.posterConfirm = false; S.view = 'poster'; $('#ov-manage').hidden = true; render(); $('#main').scrollTop = 0; }
  } catch (err) { showErr('#form-err', writeErr(err)); }
  finally { btn.disabled = false; btn.textContent = '저장'; }
});
async function confirmDelete(id) {
  try {
    await deleteActivity(id);
    S.deleting = null; S.posterConfirm = false;
    if (S.view === 'poster' && S.posterId === id) { S.view = 'home'; render(); } else renderData();
    toast('활동을 삭제했어요.');
  } catch (e) { toast(writeErr(e)); }
}
async function seedSamples(btn) {
  btn.disabled = true;
  try { const j = await api('seed', { method: 'POST' }); await refreshActs(); toast(`예시 활동 ${j.count}개를 넣었어요. 필요 없으면 + 버튼에서 지울 수 있어요.`); }
  catch (e) { toast(e.message); btn.disabled = false; }
}
function closeOverlays() { $('#ov-manage').hidden = true; $('#ov-form').hidden = true; S.deleting = null; }

/* ---------- 탐색 ---------- */
function go(view) {
  S.view = view; S.posterConfirm = false;
  if (view !== 'chat') $('#view-chat').innerHTML = '';
  render(); $('#main').scrollTop = 0;
}
function openPoster(id) { S.posterId = id; closeOverlays(); go('poster'); if (isTeacher()) refreshApplicants(); }

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3000); }

document.addEventListener('click', e => {
  const tg = e.target.closest('[data-tog]');
  if (tg) { tg.setAttribute('aria-pressed', tg.getAttribute('aria-pressed') !== 'true'); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'login-tab': setLoginTab(id); break;
    case 'nav': go(id); break;
    case 'open': openPoster(id); break;
    case 'mode': S.listMode = id; renderHome(); break;
    case 'filter': S.filter = id; renderHome(); break;
    case 'cal-prev': S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() - 1, 1); renderHome(); break;
    case 'cal-next': S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() + 1, 1); renderHome(); break;
    case 'cal-day': S.calDay = id; renderHome(); break;
    case 'apply': toggleApply(id); break;
    case 'manage': openManage(); break;
    case 'close-manage': $('#ov-manage').hidden = true; S.deleting = null; break;
    case 'close-overlay': if (e.target === el) { $('#ov-manage').hidden = true; S.deleting = null; } break;
    case 'new': openForm(null); break;
    case 'edit': openForm(id); break;
    case 'close-form': $('#ov-form').hidden = true; break;
    case 'del': S.deleting = id; renderManageList(); break;
    case 'del-cancel': S.deleting = null; renderManageList(); break;
    case 'del-poster': S.posterConfirm = true; renderPoster(); break;
    case 'del-cancel-poster': S.posterConfirm = false; renderPoster(); break;
    case 'del-confirm': confirmDelete(id); break;
    case 'seed': seedSamples(el); break;
    case 'swatch': S.editing.color = id; $$('.swatch').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === id)); updateThumb(); break;
    case 'img-remove': S.editing.image = ''; updateThumb(); break;
    case 'photo-remove': S.draftPhoto = ''; $('#pf-avatar').innerHTML = esc(S.session.name.slice(0, 1)); break;
    case 'save-profile': doSaveProfile(); break;
    case 'logout': logout(); break;
    case 'ask': sendChat(id); break;
    case 'chat-stop': if (S.chatCtl) S.chatCtl.abort(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#ov-form').hidden) $('#ov-form').hidden = true;
  else if (!$('#ov-manage').hidden) { $('#ov-manage').hidden = true; S.deleting = null; }
});

/* ---------- 시작 ---------- */
const restored = !!S.session;
render();
if (restored) afterLogin();
ready.then(() => {
  updateLoginForServer();
  startData();
  renderData();
});
})();
</script>
</body>
</html>
